<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsor Us | Youth Empowerment Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Header-->
    <header>
        <div class="logo"> 
         <nav style="display: inline"> 
             <a href="index.html">Home</a> &nbsp;&nbsp;&nbsp;&nbsp;
             <a href="applications.html">Applications</a>&nbsp;&nbsp;&nbsp;&nbsp;
             <a href="job-posts.html">Job Posts</a>&nbsp;&nbsp;&nbsp;&nbsp;
             <a href="sponsors.html">Sponsor Us</a>&nbsp;&nbsp;&nbsp;&nbsp;
             <a href="about.html">About</a>&nbsp;&nbsp;&nbsp;&nbsp;
             <a href="contact.html">Contact Us</a>&nbsp;&nbsp;
             <a href="enquiry.html">Enquiries</a>
             <hr>
        </nav>
        <h1>Sponsorship</h1>
        </div>
    </header>

    <!--Main Content-->
    <main>
        <!--Sponsor Logos-->
        <section class="sponsor-logos">
        <h3>Supported by: </h3>
        <div class="logos">
            <div> 
                <img src="images/eskom.webp" alt="Eskom Logo" width="100" height="100">
                 <img src="images/shoprite.webp" alt="Shoprite Logo" width="100" height="100">
            </div>
            <div>
                <img src="images/anglo_american.webp" alt="Anglo American Logo" width="100" height="80">
                 <img src="images/spar.webp" alt="Spar Logo" width="100" height="100">           
            </div>
            <div>
                <img src="images/amazon.png" alt="Amazon Logo" width="100" height="100">
            </div>
            
        </div>
        </section>

        <!--Sponsor Form-->
        <section class="sponsor-form">
            <h3>Become a Sponsor</h3>
            <form action=" " method="post">
                <label for="companyName">Company Name: </label>
                <input type="text" id="companyName" name="companyName" required>
                <br><br>
                <label for="contactPerson">Contact Person: </label>
                <input type="text" id="contactPerson" name="contactPerson" required>
                <br><br>
                <label for="email">Email Address: </label>
                <input type="email" id="email" name="email" required>
                <br><br>
                <label for="phone">Phone Number: </label>
             <input type="tel" id="phone" name="phone" required>
             <br><br>
             <label for="message">Message/Sponsorship Details: </label>
             <textarea id="message" name="message" rows="5" placeholder="Tell us how you'd like to support...."></textarea>
             <br><br>
             <button type="submit">Submit Sponsorships</button>
            </form>
        </section>

        <div id="lightbox" class="lightbox">
            <span id="closeBtn">&times;</span>
        </div>

    </main>

    <!--Footer-->
    <footer>
        <p> <small>&copy; 2026 Youth Empowerment Network - Empowering Youth for a Brighter futore</small></p>
    </footer>
</body>
</html>

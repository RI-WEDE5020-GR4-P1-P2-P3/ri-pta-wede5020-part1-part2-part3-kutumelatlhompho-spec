        <h1>Applications</h1>
        </div>
    </header>

    <!--Main Content-->
    <main>
        <!--Application form-->
        <section class="application">
        <h3>Submit your Details</h3>
        <form action="#" method="post" >
             <label for="fullname">Full Name: </label>
             <input type="text" id="fullname" name="fullname" required>
             <br><br>
             <label for="email">Email Address: </label>
             <input type="email" id="email" name="email" required>
            <br><br>
             <label for="phone">Phone Number: </label>
             <input type="tel" id="phone" name="phone" required>
             <br><br>
              <label for="matric">Upload matric certificate: </label>
             <input type="file" id="matric" name="matric" accept=".pdf,.doc,.docx" required>
            <br><br>
             <label for="degree">Upload Highest degree: </label>
             <input type="file" id="degree" name="degree" accept=".pdf,.doc,.docx" required>
            <br><br>
             <label for="cv">Upload CV: </label>
             <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx" required>
            <br><br>
             <label for="skills">Skills/ Interests: </label>
             <textarea id="skills" name="skills" rows="4" placeholder="List your skills here...."></textarea>
            <br><br>
             <button type="submit">Submit Details</button>
        </form>
        </section>
    </main>

     <!--Footer-->

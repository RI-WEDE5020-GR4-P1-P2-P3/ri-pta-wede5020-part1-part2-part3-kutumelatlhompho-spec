        <h1>Enquiries</h1>

     <!--Main Content-->
    <main>
        <!--Enquiry Form-->
        <section class="enquiry-form">
            <h3>General Enquiries</h3>
            <br><br>
            <form id="enquiryForm" action="#" method="post">
                <label for="enquiryType">Enquiry Type: </label>
                 <select id="enquiryType" name="enquiryType" required>
                    <option value="" disable selected>Select an answer</option>
                    <option>Sponsorship</option>
                    <option>Job Opportunities</option>
                    <option>Volunteer Work</option>
                    <option>General Question</option>
                </select>
                </p>
                <label for="fullname">Full Name: </label>
                <input type="text" id="fullname" name="fullname" required>
                <br><br>
                <label for="email">Email Address: </label>
                <input type="email" id="email" name="email" required>
                <br><br>
                <label for="message">Message: </label>
                <textarea id="message" name="message" rows="5" placeholder="Write your enquiry here..." required minlength="20"></textarea>
                <br><br>
                <button type="submit">Submit Enquiry</button>
            </form>

            <div id="errorMessage"></div>
            <div id="responseMessage"></div>

        </section>
        </main>
